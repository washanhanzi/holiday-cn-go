name: Update Submodule

on:
  schedule:
    # 09:37 UTC: overnight in the continental US, away from the hourly rush.
    # Picks up the previous day's upstream update at 12:00 UTC.
    - cron: '37 9 * * *'
  workflow_dispatch:

concurrency:
  group: holiday-data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up minimum supported Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Update and regenerate holiday data
        id: update
        run: bash scripts/update-data.sh

      - name: Verify generated data
        if: steps.update.outputs.changed == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go test -race ./...
          go vet ./...

      - name: Commit and push updated data
        if: steps.update.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- holiday-cn pkg/holiday
          git commit -m "chore: update holiday data for $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update-submodule
    if: needs.update-submodule.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      commit: ${{ needs.update-submodule.outputs.commit }}
