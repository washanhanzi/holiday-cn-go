name: Publish Release

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit containing the updated holiday data
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Test and publish the same commit, including when called by the data updater.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.commit || github.sha }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: holiday-data-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      # Validate the module against v0.4 and reuse an existing tag on retries.
      - name: Validate module and select v0.4 release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/release-tag.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ inputs.commit || github.sha }}
          generate_release_notes: true
          make_latest: true
